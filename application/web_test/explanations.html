<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<h1 class="page-title">Job Applicant Explanation Engine</h1>
<div class="page-header">
  <h2>Candidate Rank/Score Explanations</h2>
  <button type="button" onclick="location.href=`/job.html?job_id=${encodeURIComponent(jobId)}`">← Back to Job</button>
</div>
<div id="jobSummary">Loading…</div>
<div id="explanations">Loading…</div>

</body>
</html>
<script>

  function esc(s) {
    s = (s ?? "").toString();
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }
  const jobId = new URLSearchParams(location.search).get("job_id");

  async function loadJobHeader() {
    const r = await fetch(`/jobs/${encodeURIComponent(jobId)}`);
    const state = await r.json();
    const job = state.job || {};
    const status = state.status || "";
    const nCands = (state.candidate_ids || []).length;
    const nExps = (state.experiments || []).length;
    document.getElementById("jobSummary").innerHTML =
      `<b>${esc(job.job_id || "")}</b><br>` +
      `status: ${esc(status)}<br>` +
      `candidates: ${nCands}<br>` +
      `experiments: ${nExps}`;  function fmtRankDelta(x) {
        return Number.isFinite(x) ? (x > 0 ? "+" + x : "" + x) : "";
      }
    }

  function fmtNum(x, digits) {
    return Number.isFinite(x) ? x.toFixed(digits) : "";
  }
  function fmtPct01(x, digits=0) {
    return Number.isFinite(x) ? (x * 100).toFixed(digits) + "%" : "";
  }
function renderExplanationsTable(title, records) {
  let html = `<h4>${esc(title)}</h4>`;
  html += `<div class="table-scroll">`;
  html += `<table>
    <thead>
      <tr>
        <th>Candidate</th>
        <th class="text-right">Baseline norm</th>
        <th class="text-right">Baseline rank</th>
        <th>Top reason</th>
        <th class="text-right">Top factor norm</th>
        <th class="text-right">Top factor rank</th>
        <th>Combined</th>
        <th class="text-right">Combined norm</th>
        <th class="text-right">Combined rank</th>
      </tr>
    </thead>
    <tbody>`;

  const rows = (records || []).slice().sort(
    (a, b) => (a.baseline_rank ?? 999999) - (b.baseline_rank ?? 999999)  );

  for (const rec of rows) {
    const cid = rec.candidate_id || "";
    const bNorm = Number(rec.baseline_norm);
    const bRank = Number(rec.baseline_rank);
    const factors = rec.factors || [];
    const atomic = factors.filter(f => (f.case_type || "") !== "combined");
    const combined = factors.find(f => (f.case_type || "") === "combined") || null;
    const topF = atomic.length ? atomic[0] : null;
    const topReason = topF ? (topF.full_reason || topF.short_reason || topF.case_type || "") : "—";
    const topNorm = topF ? (bNorm + Number(topF.delta_norm)) : NaN;
    const topRank = topF ? (bRank - Number(topF.delta_rank)) : NaN;
    const combNorm = combined ? (bNorm + Number(combined.delta_norm)) : NaN;
    const combRank = combined ? (bRank - Number(combined.delta_rank)) : NaN;
    const factorCount = atomic.length;
    const combinedText = combined
      ? `${factorCount} factor${factorCount === 1 ? "" : "s"} combined`
      : "—";

    html += `<tr>
      <td>
        <button type="button" onclick="location.href='/candidate_results.html?job_id=${encodeURIComponent(jobId)}&candidate_id=${encodeURIComponent(cid)}&ranker=${encodeURIComponent(rec.ranker || "")}'">${esc(cid)}</button>
      </td>
      <td class="text-right">${fmtNum(bNorm, 1)}</td>
      <td class="text-right">${Number.isFinite(bRank) ? bRank : ""}</td>
      <td>${esc(topReason)}</td>
      <td class="text-right">${fmtNum(topNorm, 1)}</td>
      <td class="text-right">${Number.isFinite(topRank) ? topRank : ""}</td>
      <td>${esc(combinedText)}</td>
      <td class="text-right">${fmtNum(combNorm, 1)}</td>
      <td class="text-right">${Number.isFinite(combRank) ? combRank : ""}</td>
    </tr>`;
  }
  html += `</tbody></table></div>`;
  return html;
}

async function loadExplanations() {
  const r = await fetch(`/jobs/${encodeURIComponent(jobId)}/explanations`);
  if (!r.ok) {
    document.getElementById("explanations").textContent = "No explanations available";
    return;
  }

  const data = await r.json();
  const records = data.explanations || [];

  // group by ranker
  const byRanker = {};
  for (const rec of records) {
    const ranker = rec.ranker || "";
    (byRanker[ranker] ||= []).push(rec);
  }

  let html = "";
  for (const model of Object.keys(byRanker)) {
    html += `<h3>${esc(model)}</h3>`;
    html += renderExplanationsTable("Explanations", byRanker[model]);
  }

  document.getElementById("explanations").innerHTML = html || "Empty";
}

  window.addEventListener("load", async () => {
    await loadJobHeader();
    await loadExplanations();
  });
</script>
